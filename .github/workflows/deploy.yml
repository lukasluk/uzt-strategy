name: Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          {
            printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" | perl -pe 's/\\n/\n/g; s/\r//g'
            printf '\n'
          } > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          rsync -az --delete -e "ssh" ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/uzt-strategy-src
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "bash /srv/uzt-strategy-src/deploy/deploy.sh"

      - name: Verify API on VM
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "curl -fsS http://127.0.0.1:3000/api/health"
